<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Licensing Intelligence Agent</title>
<!-- Markdown rendering: agent replies come back as markdown (tables, bold,
     lists). marked turns them into HTML; DOMPurify sanitizes before insert. -->
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --border: #e4e6ea;
    --text: #1a1c20;
    --muted: #71757e;
    --accent: #2563eb;
    --accent-soft: #eaf1ff;
    --user-bubble: #2563eb;
    --tool-bg: #f4f1ea;
    --tool-border: #e6ddc8;
    --tool-text: #8a6d2f;
    --ok: #15803d;
    --err: #c0341d;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100vh;
    font-size: 14px; line-height: 1.55;
  }

  /* ── Header ─────────────────────────────────────────── */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; background: var(--panel);
    border-bottom: 1px solid var(--border); z-index: 10;
  }
  .logo {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    background: linear-gradient(135deg, #2563eb, #1e40af);
    display: grid; place-items: center; color: #fff;
    font-weight: 700; font-size: 15px;
  }
  .titles { display: flex; flex-direction: column; line-height: 1.25; }
  .titles h1 { font-size: 15px; font-weight: 640; }
  .titles .sub { font-size: 11.5px; color: var(--muted); }
  .titles .sub .dot { color: var(--ok); }
  header .spacer { flex: 1; }
  #newChat {
    font-size: 12.5px; color: var(--muted); background: transparent;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; font-weight: 500;
  }
  #newChat:hover { background: var(--bg); color: var(--text); }

  /* ── Chat scroll area ───────────────────────────────── */
  #scroll { flex: 1; overflow-y: auto; }
  #chat {
    max-width: 780px; width: 100%; margin: 0 auto;
    padding: 28px 20px 12px;
    display: flex; flex-direction: column; gap: 18px;
  }

  .row { display: flex; flex-direction: column; gap: 5px; }
  .row.user { align-items: flex-end; }
  .role {
    font-size: 11px; font-weight: 600; letter-spacing: .02em;
    color: var(--muted); padding: 0 4px;
  }
  .bubble {
    max-width: 86%; padding: 12px 16px; border-radius: 16px;
    word-wrap: break-word; overflow-wrap: anywhere;
  }
  .user .bubble {
    background: var(--user-bubble); color: #fff;
    border-bottom-right-radius: 5px;
  }
  .agent .bubble {
    background: var(--panel); border: 1px solid var(--border);
    border-bottom-left-radius: 5px; box-shadow: var(--shadow);
    max-width: 100%;
  }

  /* Markdown inside agent bubbles */
  .agent .bubble > *:first-child { margin-top: 0; }
  .agent .bubble > *:last-child { margin-bottom: 0; }
  .agent .bubble p { margin: 0 0 10px; }
  .agent .bubble ul, .agent .bubble ol { margin: 0 0 10px; padding-left: 20px; }
  .agent .bubble li { margin: 2px 0; }
  .agent .bubble strong { font-weight: 650; }
  .agent .bubble code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px;
    background: var(--bg); padding: 1.5px 5px; border-radius: 5px;
  }
  .agent .bubble pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; overflow-x: auto; margin: 0 0 10px;
  }
  .agent .bubble pre code { background: none; padding: 0; }
  .agent .bubble table {
    border-collapse: collapse; margin: 4px 0 12px; font-size: 13px;
    width: 100%;
  }
  .agent .bubble th, .agent .bubble td {
    border: 1px solid var(--border); padding: 6px 10px; text-align: left;
  }
  .agent .bubble th { background: var(--bg); font-weight: 620; }
  .agent .bubble tr:nth-child(even) td { background: #fafbfc; }

  /* ── Tool-call strip ────────────────────────────────── */
  .tools { display: flex; flex-wrap: wrap; gap: 6px; padding: 1px 4px 2px; }
  .tool-chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-family: ui-monospace, Menlo, monospace;
    background: var(--tool-bg); border: 1px solid var(--tool-border);
    border-radius: 999px; padding: 3px 11px; color: var(--tool-text);
    cursor: default;
  }
  .tool-chip.err { background: #fdecea; border-color: #f3c4bd; color: var(--err); }

  /* ── Thinking indicator ─────────────────────────────── */
  .thinking { display: flex; align-items: center; gap: 8px; padding: 4px; color: var(--muted); font-size: 13px; }
  .dots { display: inline-flex; gap: 3px; }
  .dots span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: .15s; }
  .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,80%,100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

  /* ── Welcome / empty state ──────────────────────────── */
  #welcome { padding: 36px 4px; }
  #welcome h2 { font-size: 19px; font-weight: 640; margin-bottom: 6px; }
  #welcome p { color: var(--muted); margin-bottom: 18px; }
  .examples { display: flex; flex-direction: column; gap: 8px; }
  .example {
    text-align: left; background: var(--panel); border: 1px solid var(--border);
    border-radius: 11px; padding: 12px 15px; cursor: pointer; font-size: 13.5px;
    color: var(--text); box-shadow: var(--shadow); transition: border-color .12s;
  }
  .example:hover { border-color: var(--accent); }
  .example .tag { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }

  /* ── Composer ───────────────────────────────────────── */
  .composer-wrap { background: var(--panel); border-top: 1px solid var(--border); }
  form {
    max-width: 780px; width: 100%; margin: 0 auto;
    padding: 14px 20px 10px; display: flex; flex-direction: column; gap: 5px;
  }
  .composer {
    display: flex; align-items: flex-end; gap: 8px;
    border: 1px solid var(--border); border-radius: 14px;
    padding: 7px 7px 7px 14px; background: var(--bg);
    transition: border-color .12s;
  }
  .composer:focus-within { border-color: var(--accent); background: var(--panel); }
  textarea {
    flex: 1; border: none; outline: none; resize: none; background: transparent;
    font-family: inherit; font-size: 14px; line-height: 1.5; color: var(--text);
    max-height: 160px; padding: 4px 0;
  }
  #send {
    width: 34px; height: 34px; flex-shrink: 0; border: none; border-radius: 9px;
    background: var(--accent); color: #fff; cursor: pointer;
    display: grid; place-items: center;
  }
  #send:disabled { opacity: .4; cursor: default; }
  #send svg { width: 17px; height: 17px; }
  .hint { font-size: 11px; color: var(--muted); text-align: center; padding-bottom: 4px; }
</style>
</head>
<body>
<header>
  <div class="logo">L</div>
  <div class="titles">
    <h1>Licensing Intelligence Agent</h1>
    <div class="sub" id="status"><span class="dot">●</span> connecting…</div>
  </div>
  <div class="spacer"></div>
  <button id="newChat" title="Start a new conversation">New chat</button>
</header>

<div id="scroll">
  <div id="chat">
    <div id="welcome">
      <h2>How can I help with licensing today?</h2>
      <p>I can look up licenses, diagnose activation issues, and take role-gated CS actions — every write is audited.</p>
      <div class="examples">
        <button class="example" data-q="What licenses does Acme Corp have?">
          <span class="tag">Query</span>What licenses does Acme Corp have?
        </button>
        <button class="example" data-q="jane.doe@acmecorp.com can't activate Simulink on her new laptop. Look into why and resolve it.">
          <span class="tag">Diagnose &amp; resolve</span>jane.doe@acmecorp.com can't activate Simulink on her new laptop…
        </button>
        <button class="example" data-q="Which enterprise licenses expire in the next 60 days?">
          <span class="tag">Search</span>Which enterprise licenses expire in the next 60 days?
        </button>
      </div>
    </div>
  </div>
</div>

<div class="composer-wrap">
  <form id="form">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message the licensing agent…" autocomplete="off" autofocus></textarea>
      <button id="send" type="submit" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for a new line</div>
  </form>
</div>

<script>
const scroll = document.getElementById("scroll");
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const welcome = document.getElementById("welcome");
let sessionId = null;

marked.setOptions({ breaks: true });

fetch("/api/tools").then(r => r.json()).then(d => {
  document.getElementById("status").innerHTML =
    `<span class="dot">●</span> ${d.tools.length} tools · acting as ${d.actor}`;
}).catch(() => {
  document.getElementById("status").innerHTML =
    `<span style="color:var(--err)">●</span> server not reachable`;
});

function scrollDown() { scroll.scrollTop = scroll.scrollHeight; }

function addMessage(role, markdown) {
  const row = document.createElement("div");
  row.className = "row " + role;
  const label = document.createElement("div");
  label.className = "role";
  label.textContent = role === "user" ? "You" : "Agent";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (role === "agent") {
    bubble.innerHTML = DOMPurify.sanitize(marked.parse(markdown));
  } else {
    bubble.textContent = markdown;
  }
  row.append(label, bubble);
  chat.appendChild(row);
  scrollDown();
  return row;
}

function addToolStrip(calls) {
  if (!calls || !calls.length) return;
  const wrap = document.createElement("div");
  wrap.className = "tools";
  for (const c of calls) {
    const chip = document.createElement("span");
    chip.className = "tool-chip" + (c.is_error ? " err" : "");
    chip.textContent = "⚙ " + c.tool;
    chip.title = JSON.stringify(c.input, null, 2);
    wrap.appendChild(chip);
  }
  chat.appendChild(wrap);
  scrollDown();
}

function addThinking() {
  const el = document.createElement("div");
  el.className = "thinking";
  el.innerHTML = `<span class="dots"><span></span><span></span><span></span></span> working…`;
  chat.appendChild(el);
  scrollDown();
  return el;
}

async function sendMessage(text) {
  if (welcome) welcome.remove();
  addMessage("user", text);
  input.value = "";
  input.style.height = "auto";
  send.disabled = true;
  const pending = addThinking();

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });
    const data = await res.json();
    sessionId = data.session_id;
    pending.remove();
    addToolStrip(data.tool_calls);
    addMessage("agent", data.reply);
  } catch (err) {
    pending.remove();
    addMessage("agent", "**Error:** " + err.message);
  } finally {
    send.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (text) sendMessage(text);
});

// Enter sends; Shift+Enter inserts a newline.
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

// Auto-grow the textarea.
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
});

// Clickable example prompts.
document.querySelectorAll(".example").forEach(btn => {
  btn.addEventListener("click", () => sendMessage(btn.dataset.q));
});

// New chat resets the session.
document.getElementById("newChat").addEventListener("click", () => {
  sessionId = null;
  chat.innerHTML = "";
  location.reload();
});
</script>
</body>
</html>
