# Observability stack for Licensing Intelligence MCP
#
# Run alongside the agent (in a separate terminal):
#   docker compose -f observability/docker-compose.yml up
#
# Then open:
#   Prometheus:   http://localhost:9090   (query metrics, inspect targets)
#   Grafana:      http://localhost:3000   (admin / admin — dashboards)
#   Alertmanager: http://localhost:9093   (alert routing and silences)
#
# Prometheus scrapes the agent at host.docker.internal:8100/metrics.
# The agent must be running locally via: uvicorn agent.app:app --port 8100

services:

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: licensing-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerting_rules.yml:/etc/prometheus/alerting_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Retention: 15 days locally. In production, Thanos sidecar would
      # ship blocks to object storage for long-term retention + multi-cluster queries.
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"   # allows POST /-/reload to hot-reload config
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: licensing-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Disable login for local dev — remove in production
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: licensing-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
