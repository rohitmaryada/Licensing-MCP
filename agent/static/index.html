<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Licensing Intelligence Agent</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --border: #e2e2de;
    --text: #1f1f1e; --muted: #6e6e6a; --accent: #0a7cff;
    --user: #0a7cff; --tool: #f0ede6;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 14px 22px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { font-size: 16px; font-weight: 650; }
  header span { font-size: 12px; color: var(--muted); }
  #chat {
    flex: 1; overflow-y: auto; padding: 24px;
    display: flex; flex-direction: column; gap: 14px;
    max-width: 860px; width: 100%; margin: 0 auto;
  }
  .msg { max-width: 75%; padding: 11px 15px; border-radius: 14px;
         line-height: 1.5; font-size: 14px; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--user); color: #fff;
          border-bottom-right-radius: 4px; }
  .agent { align-self: flex-start; background: var(--panel);
           border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .tools { align-self: flex-start; display: flex; flex-wrap: wrap; gap: 6px;
           max-width: 75%; }
  .tool-chip {
    font-size: 11.5px; font-family: ui-monospace, Menlo, monospace;
    background: var(--tool); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px 10px; color: var(--muted);
  }
  .tool-chip.err { border-color: #d33; color: #d33; }
  .thinking { align-self: flex-start; color: var(--muted); font-size: 13px;
              padding: 4px 2px; }
  form {
    display: flex; gap: 10px; padding: 16px 24px 22px;
    background: var(--panel); border-top: 1px solid var(--border);
  }
  form > div { display: flex; gap: 10px; max-width: 860px; width: 100%; margin: 0 auto; }
  input {
    flex: 1; padding: 11px 15px; border: 1px solid var(--border);
    border-radius: 10px; font-size: 14px; outline: none; background: var(--bg);
  }
  input:focus { border-color: var(--accent); }
  button {
    padding: 11px 20px; border: none; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Licensing Intelligence Agent</h1>
  <span id="status">connecting…</span>
</header>

<div id="chat"></div>

<form id="form">
  <div>
    <input id="input" placeholder="e.g. jane.doe@acmecorp.com can't activate Simulink on her new laptop"
           autocomplete="off" autofocus>
    <button id="send" type="submit">Send</button>
  </div>
</form>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
let sessionId = null;

fetch("/api/tools").then(r => r.json()).then(d => {
  document.getElementById("status").textContent =
    `${d.tools.length} tools · acting as ${d.actor}`;
});

function add(cls, text) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

function addToolChips(calls) {
  if (!calls.length) return;
  const wrap = document.createElement("div");
  wrap.className = "tools";
  for (const c of calls) {
    const chip = document.createElement("span");
    chip.className = "tool-chip" + (c.is_error ? " err" : "");
    chip.textContent = "⚙ " + c.tool;
    chip.title = JSON.stringify(c.input, null, 2);
    wrap.appendChild(chip);
  }
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  add("user", text);
  input.value = "";
  send.disabled = true;
  const pending = add("thinking", "thinking…");

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });
    const data = await res.json();
    sessionId = data.session_id;
    pending.remove();
    addToolChips(data.tool_calls);
    add("agent", data.reply);
  } catch (err) {
    pending.remove();
    add("agent", "Error: " + err.message);
  } finally {
    send.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
